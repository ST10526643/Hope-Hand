<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enquiry | HopeHands Foundation</title>
</head>
<body style="margin:0; background:#ffffff; color:#315640; font-family:Arial, Helvetica, sans-serif; line-height:1.6;">
  <header style="background:#ffffff; text-align:center; padding:20px;">
    <a href="index.html" style="color:#315640; text-decoration:none; font-size:24px; font-weight:bold;"><span style="color:#e39a52;">HopeHands</span> Foundation</a>
    <nav style="margin-top:12px;"><a href="index.html" style="color:#315640; margin:0 8px;">Home</a><a href="services.html" style="color:#315640; margin:0 8px;">Services</a><a href="about.html" style="color:#315640; margin:0 8px;">About</a><a href="enquiry.html" style="color:#315640; margin:0 8px;">Enquiry</a><a href="contact.html" style="color:#315640; margin:0 8px;">Contact</a></nav>
  </header>
  <main style="max-width:650px; margin:0 auto; padding:50px 25px;">
    <h1>Enquiry</h1><p>Use this form if you would like to sponsor one of our projects or donate goods.</p>
    <form action="#" method="post" style="padding:22px 0;">
      <label for="name">Name</label><br><input id="name" name="Name" type="text" required style="width:100%; box-sizing:border-box; padding:9px; margin:5px 0 15px;">
      <label for="type">I am interested in</label><br><select id="type" name="Interest" style="width:100%; padding:9px; margin:5px 0 15px;"><option>Sponsoring</option><option>Donating goods</option></select>
      <label for="message">Message</label><br><textarea id="message" name="Message" rows="5" required style="width:100%; box-sizing:border-box; padding:9px; margin:5px 0 15px;"></textarea>
      <button type="submit" style="background:#5d8b62; color:white; border:0; padding:10px 18px;">Send enquiry</button>
    </form>
  </main>
  <footer style="padding:20px; text-align:center; color:#587263;">HopeHands Foundation | South Africa</footer>
</body>
</html>
